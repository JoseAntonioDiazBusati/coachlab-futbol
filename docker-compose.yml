services:

  backend:
    image: joseantoniodiazbusati/coachlab-backend:latest
    build:
      context: .
      dockerfile: backend/coachlab-springboot/coachlab/Dockerfile
      args:
        SRC_PATH: backend/coachlab-springboot/coachlab
    container_name: coachlab-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      FD_API_KEY: ${FD_API_KEY}
      H2_PATH: /data/coachlabdb
    volumes:
      - db-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: joseantoniodiazbusati/coachlab-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coachlab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
    driver: bridge
