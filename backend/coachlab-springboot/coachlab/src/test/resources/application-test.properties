# Perfil de test: H2 en memoria, recreada en cada arranque.
spring.datasource.url=jdbc:h2:mem:coachlabtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Secretos de prueba (no se usan en lógica de partidos pero evitan fallos de arranque).
coachlab.jwt.secret=test-secret-must-be-long-enough-to-satisfy-256-bits-requirement
coachlab.jwt.expiration-ms=604800000
coachlab.fd.api-key=test-key
coachlab.fd.api-base=https://api.football-data.org/v4
