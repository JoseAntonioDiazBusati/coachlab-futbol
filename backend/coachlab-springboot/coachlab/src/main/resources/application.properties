# =============================================
# CoachLab Fútbol - Configuración base (MySQL)
# La aplicación usa SIEMPRE MySQL. Perfiles:
#   · (sin perfil) / prod → MySQL (host `mysql` de docker-compose por defecto)
#   · dev  → MySQL en localhost + datos demo
#   · test → H2 en memoria (solo para la suite de tests)
# =============================================

# --- Servidor ---
server.port=8080
server.servlet.context-path=/

# --- Aplicación ---
spring.application.name=coachlab-futbol

# Forzar modo servlet (Tomcat) aunque webflux esté en el classpath para WebClient
spring.main.web-application-type=servlet

# --- Base de datos MySQL ---
# Para un MySQL externo (Aiven, Railway, Clever Cloud…) que exige SSL, define la
# variable de entorno DB_URL con la cadena JDBC completa del proveedor, p.ej.:
#   DB_URL=jdbc:mysql://host:puerto/basedatos?sslMode=REQUIRED&serverTimezone=UTC
# Si no se define DB_URL, se compone desde DB_HOST/DB_PORT/DB_NAME.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:coachlab}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:coachlab}
spring.datasource.password=${DB_PASSWORD:coachlab}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# El dialecto lo detecta Hibernate automáticamente desde la conexión.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JSON - Manejo de lazy loading ---
spring.jpa.open-in-view=false

# --- Actuator (solo health para el healthcheck de Docker/Render) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- JWT ---
coachlab.jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production-must-be-long-enough-256bits}
coachlab.jwt.expiration-ms=604800000

# --- CORS ---
coachlab.cors.allowed-origins=${COACHLAB_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- football-data.org proxy ---
# La API key NUNCA se commitea: se inyecta vía la variable de entorno FD_API_KEY
# (ver .env.example). Sin ella, las llamadas a football-data quedan deshabilitadas.
coachlab.fd.api-key=${FD_API_KEY:}
coachlab.fd.api-base=https://api.football-data.org/v4
