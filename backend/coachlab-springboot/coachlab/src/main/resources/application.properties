# =============================================
# CoachLab Fútbol - Configuración de la app
# =============================================

# --- Servidor ---
server.port=8080
server.servlet.context-path=/

# --- Aplicación ---
spring.application.name=coachlab-futbol

# --- Base de datos H2 persistente en /data (volumen Docker) ---
# En local, el archivo se guarda en ./data/coachlabdb.mv.db
spring.datasource.url=jdbc:h2:file:${H2_PATH:./data/coachlabdb};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (accesible en http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JSON - Manejo de lazy loading ---
spring.jpa.open-in-view=false

# --- JWT ---
# Inyectable via variable de entorno JWT_SECRET en producción/Docker
coachlab.jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production-must-be-long-enough-256bits}
coachlab.jwt.expiration-ms=604800000

# --- football-data.org proxy ---
coachlab.fd.api-key=${FD_API_KEY:}
coachlab.fd.api-base=https://api.football-data.org/v4
