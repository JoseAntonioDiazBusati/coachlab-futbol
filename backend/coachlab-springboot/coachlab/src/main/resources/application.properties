# =============================================
# CoachLab Fútbol - Configuración de la app
# =============================================

# --- Servidor ---
server.port=8080
server.servlet.context-path=/

# --- Aplicación ---
spring.application.name=coachlab-futbol

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:coachlabdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (accesible en http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Datos de ejemplo al arrancar ---
spring.sql.init.mode=always

# --- JSON - Manejo de lazy loading ---
spring.jpa.open-in-view=false


