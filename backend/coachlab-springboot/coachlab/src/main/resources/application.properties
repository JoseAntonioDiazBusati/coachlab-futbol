# =============================================
# CoachLab Fútbol - Configuración base
# Por defecto arranca con H2 en memoria (cero configuración para desarrollo).
# Producción usa MySQL mediante el perfil `prod` (application-prod.properties),
# que la imagen Docker activa por defecto (SPRING_PROFILES_ACTIVE=prod).
# =============================================

# --- Servidor ---
server.port=8080
server.servlet.context-path=/

# --- Aplicación ---
spring.application.name=coachlab-futbol

# Forzar modo servlet (Tomcat) aunque webflux esté en el classpath para WebClient
spring.main.web-application-type=servlet

# --- Base de datos por defecto: H2 en memoria ---
# Permite ejecutar `mvn spring-boot:run` o el botón Run del IDE sin instalar nada.
# Para datos demo + consola H2 usa el perfil dev (--spring.profiles.active=dev).
spring.datasource.url=jdbc:h2:mem:coachlab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# El dialecto lo detecta Hibernate automáticamente desde la conexión.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JSON - Manejo de lazy loading ---
spring.jpa.open-in-view=false

# --- Actuator (solo health para el healthcheck de Docker/Render) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- JWT ---
coachlab.jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production-must-be-long-enough-256bits}
coachlab.jwt.expiration-ms=604800000

# --- CORS ---
coachlab.cors.allowed-origins=${COACHLAB_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- football-data.org proxy ---
# La API key NUNCA se commitea: se inyecta vía la variable de entorno FD_API_KEY
# (ver .env.example). Sin ella, las llamadas a football-data quedan deshabilitadas.
coachlab.fd.api-key=${FD_API_KEY:}
coachlab.fd.api-base=https://api.football-data.org/v4
