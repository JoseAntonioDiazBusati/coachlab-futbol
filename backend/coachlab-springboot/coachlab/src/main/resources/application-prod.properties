# ── Perfil prod ─────────────────────────────────────────────────────────────
# Hereda la configuración MySQL de application.properties. La imagen Docker lo
# activa por defecto (SPRING_PROFILES_ACTIVE=prod). Las credenciales se inyectan
# por variables de entorno: DB_URL (o DB_HOST/DB_PORT/DB_NAME), DB_USER, DB_PASSWORD.
#
# Para datos de demostración en el despliegue (3 usuarios de prueba), define:
#   COACHLAB_SEED_DEMO=true   ->  coachlab.seed-demo
coachlab.seed-demo=${COACHLAB_SEED_DEMO:false}
