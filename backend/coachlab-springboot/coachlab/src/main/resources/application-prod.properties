# ── Perfil prod: base de datos MySQL ────────────────────────────────────────
# La imagen Docker activa este perfil por defecto (SPRING_PROFILES_ACTIVE=prod).
#
# Para un MySQL externo (Aiven, Railway, Clever Cloud…) que exige SSL, define la
# variable de entorno DB_URL con la cadena JDBC completa del proveedor, p.ej.:
#   DB_URL=jdbc:mysql://host:puerto/basedatos?sslMode=REQUIRED&serverTimezone=UTC
# Si no se define DB_URL, se compone desde DB_HOST/DB_PORT/DB_NAME (sin SSL,
# útil para el MySQL local de docker-compose, cuyo host es `mysql`).
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:coachlab}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:coachlab}
spring.datasource.password=${DB_PASSWORD:coachlab}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
