# ── Perfil dev: MySQL en localhost + datos demo ─────────────────────────────
# Pensado para ejecutar el backend en tu máquina (IntelliJ / mvn) contra un MySQL
# accesible en localhost:3306 (instalado en local, o el de docker-compose con el
# puerto 3306 publicado), O contra un MySQL externo poniendo la variable DB_URL.
#
# Arrancar con:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:coachlab}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:coachlab}
spring.datasource.password=${DB_PASSWORD:coachlab}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea los 3 usuarios de prueba con sus plantillas al arrancar (si la BD está vacía).
coachlab.seed-demo=true

spring.jpa.show-sql=false
