# ── Perfil dev: H2 en memoria para desarrollo local sin MySQL ────────────────
# Arrancar con: java -jar coachlab.jar --spring.profiles.active=dev
# O en IntelliJ/VS Code: VM options = -Dspring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:coachlabdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web de H2 (solo en dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga de datos demo (usuario demo + equipo de ejemplo). SOLO en dev.
coachlab.seed-demo=true
