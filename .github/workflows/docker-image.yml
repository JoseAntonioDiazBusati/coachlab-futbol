name: CI / Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  docker-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/coachlab-springboot/coachlab
          file: ./backend/coachlab-springboot/coachlab/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coachlab-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coachlab-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    env:
      HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Deploy backend
        run: |
          if [ -n "$HOOK_BACKEND" ]; then
            echo "Disparando deploy del backend en Render..."
            curl -fsS -X POST "$HOOK_BACKEND"
          else
            echo "RENDER_DEPLOY_HOOK_BACKEND no configurado; omitido (despliega manualmente en Render)."
          fi

      - name: Deploy frontend
        run: |
          if [ -n "$HOOK_FRONTEND" ]; then
            echo "Disparando deploy del frontend en Render..."
            curl -fsS -X POST "$HOOK_FRONTEND"
          else
            echo "RENDER_DEPLOY_HOOK_FRONTEND no configurado; omitido (despliega manualmente en Render)."
          fi
