server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy inverso al backend ──────────────────────────────────────────────
    # BACKEND_HOST y BACKEND_SCHEME se inyectan via envsubst al arrancar.
    # Render necesita que Host coincida con el hostname del servicio destino.
    resolver 8.8.8.8 valid=30s;

    location /api/ {
        set $backend "${BACKEND_SCHEME}://${BACKEND_HOST}";

        proxy_pass              $backend/api/;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;

        proxy_set_header        Host              ${BACKEND_HOST};
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_connect_timeout   30s;
        proxy_read_timeout      60s;
        proxy_send_timeout      30s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché para assets estáticos ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Seguridad básica ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
}
