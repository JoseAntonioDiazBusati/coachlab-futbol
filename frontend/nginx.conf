server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy inverso al backend ──────────────────────────────────────────────
    # Todas las peticiones a /api/* se reenvían al contenedor backend.
    # El backend maneja tanto la API REST como el proxy de football-data.org.
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para las peticiones al proxy de football-data.org
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Cualquier ruta que no sea un fichero estático real devuelve index.html
    # para que Angular Router maneje la navegación en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché para assets estáticos ───────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Seguridad básica ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
}
