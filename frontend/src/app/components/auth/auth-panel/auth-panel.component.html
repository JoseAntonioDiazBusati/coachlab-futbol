@if (open) {
  <div class="auth-backdrop" (click)="onClose()"></div>
  <section class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-head">
      <div>
        <p class="auth-eyebrow">Acceso rápido</p>
        <h3 class="auth-title" id="auth-title">{{ mode === 'login' ? 'Iniciar sesión' : 'Crear usuario' }}</h3>
      </div>
      <button class="auth-close" type="button" (click)="onClose()" aria-label="Cerrar">X</button>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab" [class.active]="mode === 'login'" (click)="onSwitch('login')">
        Iniciar sesión
      </button>
      <button type="button" class="auth-tab" [class.active]="mode === 'register'" (click)="onSwitch('register')">
        Crear usuario
      </button>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      @if (mode === 'register') {
        <label class="auth-field">
          <span>Nombre</span>
          <input type="text" name="name" [(ngModel)]="name" placeholder="Nombre del entrenador" />
        </label>

        <label class="auth-field">
          <span>Tipo de cuenta</span>
          <select name="rol" [(ngModel)]="rol">
            <option value="ENTRENADOR">Entrenador (gestiona su plantilla)</option>
            <option value="OJEADOR">Ojeador (compara plantillas de otros)</option>
          </select>
        </label>
      }

      <label class="auth-field">
        <span>Email</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="correo@equipo.com" required />
      </label>

      <label class="auth-field">
        <span>Contraseña</span>
        <input type="password" name="password" [(ngModel)]="password" placeholder="********" required />
      </label>

      @if (coldStart) {
        <p class="auth-cold-start">El servidor está despertando, esto puede tardar unos segundos…</p>
      }

      @if (error) {
        <p class="auth-error">{{ error }}</p>
      }

      <button class="auth-submit" type="submit" [disabled]="cargando">
        {{ cargando ? 'Accediendo...' : (mode === 'login' ? 'Entrar al dashboard' : 'Crear usuario') }}
      </button>
    </form>
  </section>
}
