<nav class="nav">
  <div class="logo">
    CoachLab
    <span>— FÚTBOL —</span>
  </div>
  <div class="nav-links">
    @for (item of navItems; track item.label) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.label === 'Dashboard' }"
      >
        {{ item.label }}
      </a>
    }
  </div>
  <div class="nav-actions">
    <button class="btn-ghost" (click)="logout()">Cerrar sesión</button>
  </div>
</nav>
